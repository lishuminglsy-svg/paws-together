:root{--ink:#344f50;--teal:#367e78;--paper:#fffaf0;--muted:#607b72;--gold:#e8bd73;--app-height:100dvh;--st:env(safe-area-inset-top,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#e6f1eb;color:var(--ink);font-family:PawsTC,system-ui,sans-serif}button,a{font:inherit}button{border:0;cursor:pointer;color:var(--ink);touch-action:manipulation;user-select:none;-webkit-user-select:none;font-size:16px;min-height:48px}button:focus-visible,a:focus-visible{outline:3px solid #c5903e;outline-offset:3px}button:disabled{cursor:default;opacity:.58}button:active:not(:disabled),button.held{transform:translateY(2px);filter:brightness(.92)}[hidden]{display:none!important}
#app{width:100%;height:var(--app-height);padding:var(--st) var(--sr) var(--sb) var(--sl);display:flex;flex-direction:column;background:#e6f1eb;max-width:1500px;margin:auto}
.topbar{height:62px;flex:none;padding:8px 14px;display:flex;gap:8px;align-items:center;background:var(--paper);z-index:2}.brand{display:flex;gap:9px;align-items:center;flex:1;min-width:0}.brand img{width:38px;height:38px}.brand strong{font-size:17px;display:block;white-space:nowrap}.brand span{font-size:12px;color:var(--muted)}.score{font-size:15px;white-space:nowrap;color:var(--teal);font-variant-numeric:tabular-nums}.icon-button{width:46px;height:46px;min-height:46px;border-radius:15px;background:#ececdb;display:grid;place-items:center;flex:none}.icon-button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.quest{flex:none;padding:10px 18px 12px;background:#fffaf0f7;box-shadow:0 5px 14px #344f500a;z-index:1}#steps{margin:0 0 9px;padding:0;display:flex;list-style:none;gap:5px;counter-reset:steps}#steps li{font-size:12px;flex:1;background:#ececdd;border-radius:7px;padding:4px 3px;text-align:center;color:#708278}#steps li.done{color:#fffaf0;background:#367e78}#steps li.active{box-shadow:inset 0 0 0 1.5px #367e78;color:#367e78}.quest-line{display:flex;gap:10px;align-items:center;justify-content:space-between}.quest h1{font-size:21px;line-height:1.4;margin:0;font-weight:500}#task-count{color:var(--teal);white-space:nowrap;font-size:15px}#hint{margin:5px 0 0;font-size:14px;line-height:1.5;color:var(--muted)}
#world{position:relative;flex:1;min-height:150px;overflow:hidden;touch-action:none}#scene{width:100%;height:100%;display:block;touch-action:none}#direction{position:absolute;right:12px;top:14px;background:var(--paper);color:var(--teal);padding:8px 12px;border-radius:14px;font-size:14px;box-shadow:0 3px 12px #344f5010;pointer-events:none}#direction:empty{display:none}#toast{position:absolute;bottom:12px;left:14px;right:14px;width:max-content;max-width:calc(100% - 28px);margin:0 auto;padding:10px 15px;line-height:1.5;font-size:15px;text-align:center;border-radius:16px;color:var(--paper);background:#344f50ed;opacity:0;transition:opacity .15s;pointer-events:none;z-index:2}#toast.show{opacity:1}

const objectives=[

const questions=[
 {title:'小朋友想餵小麥吃餅乾，你會怎樣說？',options:['牠很可愛，給牠吃一小口吧。','牠正在工作，請收好餅乾，讓牠專心。','先叫小麥過來，看看牠想不想吃。'],correct:1,hint:'工作中的導盲犬需要專注。不要餵食或呼喚牠，再想一想。'},

function fresh(){return {version:2,stage:0,x:225,userX:455,face:1,boxes:[false,false],cargo:-1,pot:false,score:0,attempts:[0,0],answered:[false,false],finished:false};}
function goal(s){switch(s.stage){case 0:return s.userX;case 1:if(s.cargo>=0)return 1225;if(!s.boxes[0]&&!s.boxes[1])return Math.abs(s.x-850)<Math.abs(s.x-1010)?850:1010;return s.boxes[0]?1010:850;case 2:return 1590;case 3:return 2150;case 4:return s.cargo===2?2750:2450;default:return 2530;}}
function nearby(s){return !s.finished&&s.stage<5&&Math.abs(s.x-goal(s))<108&&(s.stage!==3||s.userX>=2148);}
function actionLabel(s){if(!nearby(s))return '走近互動';if(s.stage===1)return s.cargo>=0?'放下紙箱':'拿起紙箱';if(s.stage===4)return s.cargo===2?'放好花盆':'搬開花盆';return '交談';}
function advance(s,dt,dir){
 dt=Math.min(.05,Math.max(0,dt));
 if(s.finished)return;
 if(dir){s.face=Math.sign(dir);s.x=Math.max(90,Math.min(WORLD_END,s.x+Math.sign(dir)*SPEED*dt));}
 const to=s.stage>=5?2530:s.stage>=3?2150:s.stage>=2?1420:455;
 s.userX=Math.min(to,s.userX+dt*150);
 if(s.stage===5&&s.userX>=2529){s.finished=true;s.userX=2530;}
}
function interact(s){
 if(!nearby(s))return null;
 switch(s.stage){
 case 0:return {type:'greet'};
 case 1:
  if(s.cargo>=0){s.boxes[s.cargo]=true;s.cargo=-1;s.score+=15;if(s.boxes.every(Boolean))s.stage=2;return {type:'success',text:s.stage===2?'通道整理好了！向右找小朋友。':'紙箱已放妥！友善積分 +15'};}
  s.cargo=goal(s)===850?0:1;return {type:'toast',text:'已拿起紙箱。往右走，帶到存放區。'};
 case 2:return {type:'quiz',index:0};
 case 3:return {type:'quiz',index:1};
 case 4:
  if(s.cargo===2){s.cargo=-1;s.pot=true;s.score+=10;s.stage=5;return {type:'success',text:'入口暢通了！阿晴與小麥正走向開放日。'};}
  s.cargo=2;return {type:'toast',text:'已拿起花盆，請放到右邊花台。'};
 }
}
function answer(s,index,choice){
 if(s.stage!==index+2||s.answered[index])return {type:'ignored'};
 s.attempts[index]++;
 if(choice!==questions[index].correct)return {type:'wrong',text:questions[index].hint};
 s.answered[index]=true;s.score+=20+(s.attempts[index]===1?10:0);s.stage=index===0?3:4;
 return {type:index===0?'child-thanks':'user-request'};
}
function validSave(raw){
 if(!raw||raw.version!==2||!Number.isInteger(raw.stage)||raw.stage<0||raw.stage>5)return null;
 if(!Number.isFinite(raw.x)||!Number.isFinite(raw.userX)||raw.x<90||raw.x>WORLD_END||raw.userX<455||raw.userX>2530)return null;
 if(![0,1,2,-1].includes(raw.cargo)||!Array.isArray(raw.boxes)||raw.boxes.length!==2||!raw.boxes.every(x=>typeof x==='boolean'))return null;
 if(!Array.isArray(raw.attempts)||raw.attempts.length!==2||!raw.attempts.every(x=>Number.isInteger(x)&&x>=0))return null;
 if(!Array.isArray(raw.answered)||raw.answered.length!==2||!raw.answered.every(x=>typeof x==='boolean'))return null;
 if(!Number.isInteger(raw.score)||raw.score<0||raw.score>100||typeof raw.pot!=='boolean'||typeof raw.finished!=='boolean')return null;
 // Refuse impossible task/cargo states instead of restoring a stuck game.
 if(raw.stage>=2&&!raw.boxes.every(Boolean))return null;
 if(raw.stage>=3&&!raw.answered[0])return null;
 if(raw.stage>=4&&!raw.answered[1])return null;
 if(raw.stage>=5&&!raw.pot)return null;
 if(raw.finished&&raw.stage!==5)return null;
 if(raw.cargo>=0&&raw.cargo<2&&(raw.stage!==1||raw.boxes[raw.cargo]))return null;
 if(raw.cargo===2&&raw.stage!==4)return null;
 const clean=fresh();for(const k of Object.keys(clean))if(k in raw)clean[k]=raw[k];clean.face=raw.face===-1?-1:1;return clean;
}

function talk(title,text,character,next,label='繼續散步'){open(`<p class="dialog-kicker">海風街道 · 友善的一步</p><h2 id="dialog-title">${title}</h2><div class="dialog-copy"><img class="dialog-portrait" src="${ASSETS[character+'_0']}" alt=""><p>${text}</p></div>`,[button(label,()=>{next?.();close();save();})]);}
